<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/sb.css">
<style>
.calcwrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
.calc{display:flex;flex-direction:column;gap:12px}
.screen{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 18px;text-align:right;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{font-size:20px;color:var(--ink2);word-break:break-all;min-height:28px}
.result{font-size:clamp(34px,5vw,48px);font-weight:800;line-height:1.15;word-break:break-all}
.result.preview{color:var(--ink2)}
.result.err{color:var(--bad);font-size:24px}
.rem{font-size:16px;font-weight:700;color:var(--teal);min-height:22px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{font:inherit;font-size:24px;font-weight:800;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);height:clamp(52px,7.4vh,66px);box-shadow:0 3px 0 var(--line);transition:transform .06s}
.key:active,.key.down{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key.op{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 0 #1b2b45}
.key.fn{background:var(--paper);color:var(--navy-ink)}
.key.eq{grid-column:1 / -1;background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 3px 0 #1f6f40}
.hist h3{margin:0}
.hist ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:calc(var(--vh, 100vh) - 330px);overflow:auto}
.hist ol button{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;font:inherit;font-size:17px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--ink)}
.hist ol button:hover{border-color:var(--teal)}
.hist ol button span{color:var(--ink2);word-break:break-all}
.calc-tip{margin:10px 4px 0}
@media (max-width:760px){
  .calcwrap{grid-template-columns:1fr}
  .key{height:58px;font-size:22px}
  .hist ol{max-height:none}
  .calc-tip{display:none}
}
</style>
<script src="../../shared/sb-core.js"></script>
<script src="../../registry.js"></script>
<script src="../../shared/sb-shell.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="calc.js"></script>
</body>
</html>
