<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn the Keys · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../shared/sb.css">
<link rel="stylesheet" href="../../../shared/sb-typing.css">
<style>
/* Lesson */
.lkbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin-bottom:10px}
.lkletters{display:flex;flex-wrap:wrap;gap:4px}
.lkletters span{display:inline-flex;align-items:center;justify-content:center;width:30px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font:700 17px ui-monospace,Consolas,monospace;color:var(--ink)}
.lkletters span.off{opacity:.35;border-style:dashed}
.lkletters span.ready{border-color:var(--good);background:var(--tint-good)}
.lkletters span.focus{border-color:var(--coral);border-width:3px}
.lkopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lkopts label{font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.lkopts select{border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--surface);font-size:15px}
.lkfocus{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 0 10px;font-size:16px}
.lkfocus .fk{font:800 22px ui-monospace,Consolas,monospace;border:3px solid var(--coral);border-radius:8px;padding:0 9px;background:var(--surface)}
.lkmeter{display:inline-block;width:120px;height:10px;border-radius:6px;background:var(--track);vertical-align:middle;overflow:hidden}
.lkmeter i{display:block;height:100%;background:var(--teal)}
.lkmsg{margin:8px 0 10px;min-height:26px}
.lkkb .sbkb{max-height:max(150px,calc(var(--vh,100vh) - var(--chrome) - 540px))}
/* Key Hunt */
.hunthead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;margin-bottom:8px}
.huntq{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800}
.huntletter{display:inline-flex;align-items:center;justify-content:center;min-width:84px;height:84px;padding:0 14px;border-radius:18px;border:3px solid var(--navy-ink);background:var(--surface);font:800 58px var(--font);color:var(--navy-ink)}
.hunt .sbkb{max-height:max(170px,calc(var(--vh,100vh) - var(--chrome) - 350px))}
.huntdone{text-align:center;padding:10px 0}
/* Keyboard map */
.kmgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:20px;align-items:start}
.kmgrid .sbkb{max-height:max(170px,calc(var(--vh,100vh) - var(--chrome) - 400px))}
.kmlegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:15px}
.kmlegend span{display:inline-flex;align-items:center;gap:6px}
.kmlegend i{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid var(--key-line)}
.kmpress{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px;min-height:84px;font-size:18px}
.kmpress b.big{font:800 34px ui-monospace,Consolas,monospace;margin-right:10px;vertical-align:middle}
.kmtips{margin:6px 0 0;padding-left:20px;font-size:16px}
.kmtips li{margin-bottom:6px}
/* Key stats */
.ksum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ksum div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.ksum span{display:block;font-size:14px;color:var(--ink2)}
.ksum b{font-size:22px}
.ksgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.ksgrid .sbkb{max-height:max(150px,calc(var(--vh,100vh) - var(--chrome) - 520px))}
.kskeys{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.kskeys div{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13px;line-height:1.3}
.kskeys div b{font:800 19px ui-monospace,Consolas,monospace;margin-right:4px}
.kskeys div.ready{border-color:var(--good)}
.kskeys div.focus{border-color:var(--coral);border-width:3px}
.kslegend{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px;justify-content:center}
.kslegend i{display:inline-block;width:22px;height:14px;border-radius:4px}
@media (max-width:1000px){.kmgrid,.ksgrid{grid-template-columns:1fr}}
@media (max-width:760px),(min-width:761px) and (max-height:520px){
  .ksum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lkletters span{width:24px;height:28px;font-size:15px}
  .huntletter{min-width:64px;height:64px;font-size:44px}
  .huntq{font-size:22px}
  .lkkb .sbkb,.hunt .sbkb,.kmgrid .sbkb,.ksgrid .sbkb{max-height:none}
}
</style>
<script src="../../../shared/sb-core.js"></script>
<script src="../../../shared/sb-shell.js"></script>
<script src="../../../registry.js"></script>
<script src="../../../shared/sb-module.js"></script>
<script src="../../../shared/sb-typing-words.js"></script>
<script src="../../../shared/sb-typing-gen.js"></script>
<script src="../../../shared/sb-typing.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="lk.js"></script>
</body>
</html>
