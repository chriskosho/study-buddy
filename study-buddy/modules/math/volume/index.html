<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volume of Solid Figures · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../shared/sb.css">
<style>
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:700;margin:0 .12em}
.frac .fn{padding:0 .22em;border-bottom:.09em solid currentColor}
.frac .fd{padding:0 .22em}
.mixed{display:inline-flex;align-items:center;gap:.08em;vertical-align:middle}
.mixed b{font-size:1.15em}
.qtext .frac,.qtext .mixed,.qtext .num{font-size:1.2em}
.qtext .hint-i{display:block;font-size:.72em;font-weight:500;color:var(--ink2);margin-top:6px}
.fbars{display:grid;gap:12px;margin:10px 0 14px;max-width:420px}
.fbars>div{display:grid;grid-template-columns:54px minmax(0,1fr);align-items:center;gap:10px}
.fbl{font-size:20px;text-align:center}
.fbar{width:100%;height:auto;display:block}
.fgform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.fgform .textin{width:116px;font-size:20px;text-align:center}
.fgform select{font-size:20px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.fgout{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 14px;font-size:18px;min-height:24px}
.fgout p{margin:0 0 8px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:6px}
.rule{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.rule h3{margin:0 0 6px;font-size:19px}
.rule p{margin:0 0 8px;font-size:16px}
.rule .fbars{margin:6px 0 8px}
@media (max-width:1100px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.rules{grid-template-columns:1fr}.fgform .textin{width:96px}}
.fareawrap{margin:4px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.fareawrap .hint-i{flex:1 1 220px;margin:0}.farea{width:100%;max-width:230px;height:auto;display:block;margin:0 0 8px}.rule .farea{max-width:200px}
.fignote{font-size:12px;color:var(--ink2);white-space:nowrap}.vfigwrap{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:0 0 4px}.vfig{display:block;flex:0 1 auto;width:175px;max-width:100%;height:auto;margin:0 0 4px}.vfig.big{width:200px}.qtext .vfig{max-height:160px}.rule .vfigwrap{justify-content:flex-start}.rule .vfig{width:190px}
.fgform select{max-width:100%;min-width:0}.fgform .gshape{flex:1 1 100%}
@media (max-width:760px){.fgform .textin{width:min(96px,26vw)}}
</style>
<script src="../../../shared/sb-core.js"></script>
<script src="../../../shared/sb-shell.js"></script>
<script src="../../../registry.js"></script>
<script src="../../../shared/sb-module.js"></script>
<script src="../../../shared/sb-tools.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../../../shared/sb-fractions.js"></script>
<script src="gen.js"></script>
<script src="frac.js"></script>
</body>
</html>
