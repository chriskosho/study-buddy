<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telling Time and Elapsed Time · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../shared/sb.css">
<style>
.tmclk{display:block;width:100%;height:auto;min-height:150px;max-width:205px;margin:6px auto}
.tmclk .face{fill:var(--surface);stroke:var(--navy);stroke-width:4}
.tmclk .tick{stroke:var(--ink);stroke-width:1;opacity:.55}
.tmclk .tick5{stroke-width:2.6;opacity:1}
.tmclk .num{fill:var(--ink);font:800 15px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.tmclk .hh{stroke:var(--navy);stroke-width:7;stroke-linecap:round}
.tmclk .mh{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.tmclk .pin{fill:var(--navy)}
.tmline{display:block;width:100%;max-width:440px;height:auto;min-height:90px;margin:8px auto 0}
.tmline .nl{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.tmline .arc{fill:none;stroke:var(--navy);stroke-width:3;stroke-dasharray:6 5}
.tmline .nlq{fill:var(--navy);font:800 22px system-ui,sans-serif;text-anchor:middle}
.tmline .nlt{fill:var(--ink);font:800 15px system-ui,sans-serif}
.tmline .nls{text-anchor:start}.tmline .nle{text-anchor:end}
.tmpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.tmpick figure{margin:0;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 4px}
.tmpick figcaption{font-weight:800;font-size:18px}
.tmpick .tmclk{min-height:100px;max-width:150px;margin:2px auto}
.tmpick .tmclk .num{font-size:17px}
.tmguide{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;align-items:start;margin:6px 0 14px}
.tmg-clock .tmclk{max-width:300px;min-height:200px}
.tmform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tmform .textin{width:min(160px,40vw);font-size:22px}
.derr{color:var(--bad-ink);font-weight:700;min-height:22px}
.tmbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.tmlbl{font-weight:800;margin-right:2px}.tmbtns .tmlbl:not(:first-child){margin-left:10px}
.tmshow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tmshow div{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.tmshow span{display:block;font-size:14px;opacity:.75}
.tmshow b{font-size:19px;overflow-wrap:anywhere}
#tmgDig{font-size:28px}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:6px}
.rule{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.rule h3{margin:0 0 4px;font-size:18px}
.rule p{margin:0;font-size:15px}
@media (max-width:1100px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px),(min-width:761px) and (max-height:520px){
  .rules{grid-template-columns:1fr}
  .tmguide{grid-template-columns:1fr}
  .tmpick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tmpick .tmclk{min-height:110px}
}
</style>
<script src="../../../shared/sb-core.js"></script>
<script src="../../../shared/sb-shell.js"></script>
<script src="../../../registry.js"></script>
<script src="../../../shared/sb-module.js"></script>
<script src="../../../shared/sb-tools.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="gen.js"></script>
<script src="tm.js"></script>
</body>
</html>
