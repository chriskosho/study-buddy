<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rounding and Place Value to 1,000 · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../shared/sb.css">
<style>
.rform{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.rform .textin{width:min(160px,40vw);font-size:20px}
.rform select{font:inherit;font-size:20px;font-weight:800;padding:8px 12px;border:2px solid var(--navy);border-radius:12px;background:var(--surface);color:var(--ink)}
.rform input[type=range]{flex:1 1 220px;min-width:140px;accent-color:var(--navy)}
.rerr{color:var(--bad-ink);font-weight:700;min-height:0}.rerr:empty{display:none}
.rchart{border-collapse:separate;border-spacing:0;width:100%;max-width:560px;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;table-layout:fixed;margin:0 0 4px}
.rchart th{font-size:14px;font-weight:700;color:var(--ink2);padding:8px 4px;background:var(--paper);border-bottom:1.5px solid var(--line)}
.rchart td{padding:8px 4px;border-right:1.5px solid var(--line)}
.rchart td:last-child{border-right:0}
.rchart .dg td{font-size:32px;font-weight:800;height:48px}
.rchart .vl td{font-size:15px;color:var(--ink2);border-top:1.5px solid var(--line);height:28px}
.rsays{font-size:18px;margin:4px 0 6px;line-height:1.35}
.rsays b{font-variant-numeric:tabular-nums}
.rcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;margin-top:4px;align-items:start}
.rl{display:block;width:100%;height:auto;min-height:96px;max-height:150px}
.rlwrap{max-width:560px;width:100%;margin:6px auto 0}
.rl .ln{stroke:var(--ink);stroke-width:3}
.rl .tk{stroke:var(--ink);stroke-width:3}
.rl .tk.mid{stroke:var(--ink2);stroke-dasharray:3 3}
.rl text{fill:var(--ink);font-family:inherit}
.rl .end{font-size:24px;font-weight:800}
.rl .half{font-size:17px;font-weight:700;fill:var(--ink2)}
.rl .num{font-size:26px;font-weight:800}
.rl .pt{fill:var(--coral);stroke:var(--surface);stroke-width:3}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.rule{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px}
.rule h3{margin:0 0 4px;font-size:18px}
.rule p{margin:0;font-size:15.5px;line-height:1.4}
@media (max-width:1100px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}.rcols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.rules{grid-template-columns:1fr}.rchart .dg td{font-size:30px}.rl .end{font-size:26px}}
</style>
<script src="../../../shared/sb-core.js"></script>
<script src="../../../shared/sb-shell.js"></script>
<script src="../../../registry.js"></script>
<script src="../../../shared/sb-module.js"></script>
<script src="../../../shared/sb-tools.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="gen.js"></script>
<script src="rpv.js"></script>
</body>
</html>
