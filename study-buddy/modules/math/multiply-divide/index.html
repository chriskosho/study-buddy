<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi-Digit Multiplication and Long Division · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../shared/sb.css">
<style>
.mdform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.mdform .textin{width:min(190px,42%);font-size:20px}
.mdsign{font-weight:800;color:var(--ink2)}
.mderr{color:var(--bad-ink);font-weight:700;min-height:22px}
.mdout h3{margin:14px 0 6px;font-size:20px}
.mdgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.mdscroll{overflow-x:auto;max-width:100%}
.mdcalc{display:inline-block;margin:0;padding:12px 18px;background:var(--surface);border:2px solid var(--line);border-radius:14px;font:800 22px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);white-space:pre}
.mdlines{margin:8px 0 0;padding-left:22px;font-size:17px}
.mdlines li{margin:2px 0}
.mdsteps{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.mdsteps li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:4px 16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px}
.mdsteps .st{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.mdsteps .nt{font-size:15px;color:var(--ink2)}
.mdsteps li.last{background:var(--tint-good)}
.mdarea{display:block;width:auto;max-width:100%;height:auto;max-height:185px;margin:6px 0}
.mdarea .mdc{fill:var(--surface);stroke:var(--navy-ink);stroke-width:2}
.mdarea .mdq{fill:var(--hl)}
.mdarea .mdh{fill:var(--ink2);font-size:18px;font-weight:700}
.mdarea .mdv{fill:var(--ink);font-size:22px;font-weight:800}
.qvisual .mdarea{margin:6px auto}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0}
.rung{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.rung .no{display:inline-block;min-width:30px;height:30px;line-height:30px;text-align:center;border-radius:15px;background:var(--navy);color:#fff;font-weight:800;margin-right:8px}
.rung h3{margin:0 0 6px;font-size:19px}
.rung p{margin:0 0 6px;font-size:16px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
.rule{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.rule h3{margin:0 0 6px;font-size:19px}
.rule p{margin:0 0 6px;font-size:16px}
@media (max-width:1100px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}.mdgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .rules,.ladder{grid-template-columns:1fr}
  .mdsteps li{grid-template-columns:minmax(0,1fr)}
  .mdsteps .st{font-size:17px}
  .mdcalc{font-size:18px;padding:10px 12px}
  .mdform .textin{width:42%}
}
</style>
<script src="../../../shared/sb-core.js"></script>
<script src="../../../shared/sb-shell.js"></script>
<script src="../../../registry.js"></script>
<script src="../../../shared/sb-module.js"></script>
<script src="../../../shared/sb-tools.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="gen.js"></script>
<script src="md.js"></script>
</body>
</html>
