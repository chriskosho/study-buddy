<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order of Operations · Study Buddy</title>
<meta name="theme-color" content="#2b4162">
<link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../shared/sb.css">
<style>
.ex{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.ooform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.ooform .textin{width:min(380px,100%);font-size:20px}
.oosteps{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.oosteps li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px}
.oosteps .st{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.oosteps .nt{font-size:15px;color:var(--ink2)}
.oosteps li.last{background:var(--tint-good)}
.ooerr{color:var(--bad-ink);font-weight:700;min-height:22px}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:6px 0 14px}
.rung{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.rung .no{display:inline-block;min-width:30px;height:30px;line-height:30px;text-align:center;border-radius:15px;background:var(--navy);color:#fff;font-weight:800;margin-right:8px}
.rung h3{margin:0 0 6px;font-size:19px}
.rung p{margin:0 0 6px;font-size:16px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
.rule{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.rule h3{margin:0 0 6px;font-size:19px}
.rule p{margin:0 0 6px;font-size:16px}
@media (max-width:1100px){.ladder{grid-template-columns:1fr}}
@media (max-width:760px){
  .rules{grid-template-columns:1fr}
  .oosteps li{grid-template-columns:minmax(0,1fr)}
  .oosteps .st{font-size:18px}
}
</style>
<script src="../../../shared/sb-core.js"></script>
<script src="../../../shared/sb-shell.js"></script>
<script src="../../../registry.js"></script>
<script src="../../../shared/sb-module.js"></script>
<script src="../../../shared/sb-tools.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="gen.js"></script>
<script src="ooo.js"></script>
</body>
</html>
