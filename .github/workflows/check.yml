name: Check a pull request

# Runs on every pull request: the build must already be committed (sw.js and the South America page),
# the math generators must re-check, and the main tests must pass. Nothing is deployed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04   # pinned, so the runner (and its fonts) only changes when we choose
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # If this step fails, run `node study-buddy/_dev/build.mjs` and commit the files it changes.
      - name: The build is committed
        run: |
          node study-buddy/_dev/build.mjs
          git diff --exit-code -- study-buddy/sw.js study-buddy/modules/geography/south-america/index.html

      - name: Math generators re-check
        run: node study-buddy/_dev/tests/math_gen_check.mjs

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # The layout tests (no scroll bars at 1440x900, no sideways scroll at 360px) measure text. The site asks for
      # Trebuchet MS / Segoe UI / system-ui; a plain Ubuntu runner has none of them and falls back to DejaVu Sans,
      # which is much wider than any font a Windows, Mac, iPad or Chromebook would use. Use Inter as the stand-in,
      # the same font the tests are run with locally, so the check measures what students see.
      - name: Fonts for the layout tests
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter
          sudo cp .github/fonts/56-prefer-inter.conf /etc/fonts/conf.d/
          fc-cache -f >/dev/null
          echo "sans-serif is now: $(fc-match sans-serif)"; echo "Segoe UI is now: $(fc-match 'Segoe UI')"

      - name: All tests
        run: python study-buddy/_dev/tests/run_all.py -j 3
