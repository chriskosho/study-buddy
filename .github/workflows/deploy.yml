name: Deploy to GitHub Pages

# Publishes the study-buddy/ folder (not the whole repository) every time main changes.
# Can also be run by hand: Actions tab > Deploy to GitHub Pages > Run workflow.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish instead of cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04   # pinned, so the runner (and its fonts) only changes when we choose
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Rebuilds the South America page and the offline file list (sw.js).
      - name: Build
        run: node study-buddy/_dev/build.mjs

      # Copy only what visitors need. Developer tools, tests and notes (_dev) stay out.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude '_dev' --exclude 'README.md' --exclude '.DS_Store' study-buddy/ _site/
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/sw.js && ! test -e _site/_dev

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Confirms the live site now serves this build (its offline file list carries the new version).
      - name: Check the live site has the new version
        run: |
          want=$(grep -o "VERSION = '[0-9a-f]*'" study-buddy/sw.js)
          url="${{ steps.deployment.outputs.page_url }}sw.js"
          for i in $(seq 1 20); do
            got=$(curl -s -H 'Cache-Control: no-cache' "$url?check=$i" | grep -o "VERSION = '[0-9a-f]*'" || true)
            if [ "$got" = "$want" ]; then echo "Live site is on $want"; exit 0; fi
            echo "Waiting for the live site ($got, want $want)"; sleep 15
          done
          echo "The live site did not show the new version within 5 minutes."; exit 1
