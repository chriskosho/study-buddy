# Uploads the site to Namecheap hosting (FTP over TLS) whenever main changes, or when you press "Run workflow".
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD. See study-buddy/_dev/docs/DEPLOY.md.
name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (rebuilds the South America page and the offline file list)
        run: node study-buddy/_dev/build.mjs
      - name: Collect the site, without developer folders
        run: |
          mkdir _site
          cp -r study-buddy/. _site/
          rm -rf _site/_dev
          cp study-buddy/_dev/deploy/htaccess.txt _site/.htaccess
      - name: Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ./
