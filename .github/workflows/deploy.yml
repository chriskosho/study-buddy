name: Deploy to GitHub Pages

# Publishes the study-buddy/ folder (not the whole repository) every time main changes.
# Can also be run by hand: Actions tab > Deploy to GitHub Pages > Run workflow.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish instead of cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rebuilds the South America page and the offline file list (sw.js).
      - name: Build
        run: node study-buddy/_dev/build.mjs

      # Copy only what visitors need. Developer tools, tests and notes (_dev) stay out.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude '_dev' --exclude 'README.md' --exclude '.DS_Store' study-buddy/ _site/
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/sw.js && ! test -e _site/_dev

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
